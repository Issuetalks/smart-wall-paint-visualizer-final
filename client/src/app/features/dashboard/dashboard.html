<div class="dashboard-container">
  <nav class="navbar">
    <h1>Smart Wall Paint Visualizer</h1>
    <button (click)="logout()">Logout</button>
    <button routerLink="/admin" style="background: #3b82f6; margin-right: 10px;">Admin Panel</button>
  </nav>

  <div class="main-content">
    <h2>Welcome to your Dashboard!</h2>
    <p>This is where you will upload your room photos and start painting.</p>
    
    <div class="upload-box">
      <h3>Upload a Room Photo</h3>
      
      <input type="file" (change)="onFileSelected($event)" accept="image/*" class="file-input">
      
      <button (click)="onUpload()" [disabled]="!selectedFile" class="upload-btn">
        Upload Image
      </button>

      <p *ngIf="uploadMessage" style="margin-top: 1rem; font-weight: bold; color: #10b981;">
        {{ uploadMessage }}
      </p>
    </div>

    <!-- My Projects Gallery -->
    <div class="projects-section" *ngIf="projects.length > 0">
      <h3>My Projects</h3>
      <div class="grid">
        <div class="project-card" *ngFor="let project of projects" [routerLink]="['/editor', project._id]">
          <img [src]="'http://localhost:5000' + project.originalImage" alt="Room Image">
          <div class="card-details">
            <h4>{{ project.title }}</h4>
            <p>{{ project.createdAt | date:'short' }}</p>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
